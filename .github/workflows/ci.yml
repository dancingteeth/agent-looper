name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  # Push: one group per commit so a queued main run is not dropped when another lands.
  # PR: group by ref and cancel superseded runs.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full Node matrix on main pushes; PRs use a single version to save minutes.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Clean install pack smoke (no optional peers)
        run: node --test scripts/clean-install-pack.test.mjs
      - name: Compile DSH companion plugin
        run: pnpm exec tsc -p plugins/dsh-agent-looper/tsconfig.json
      - name: Compile OpenCode companion plugin
        run: pnpm exec tsc -p plugins/opencode-agent-looper/tsconfig.json
