name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full Node matrix on main pushes; PRs use a single version to save minutes.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Compile DSH companion plugin
        run: pnpm exec tsc -p plugins/dsh-agent-looper/tsconfig.json
