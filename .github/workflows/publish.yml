name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          # Release builds should not reuse a stale store across publishes.
          package-manager-cache: false

      # Trusted publishing needs npm ≥ 11.5.1 (Node 22.14+).
      - run: npm install -g npm@^11.5.1
      - run: node -v && npm -v

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # OIDC trusted publishing — do not set NODE_AUTH_TOKEN (setup-node may inject
      # an empty/invalid token that forces token auth and yields scoped E404).
      # Configure on npmjs.com: user dancingteeth, repo agent-loop, workflow publish.yml
      - run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
